<!DOCTYPE html>
<html lang="fi">
<head>
<script>	
function arrayReverse() {
	let reverse = a => [...a].map(a.pop, a);
	const list = [];
	for (let step = 0; step < 5; step++) //Tässä teidän for-lause :P
		list.push(prompt("gib number"));
	console.log(`The list in input order:, ${list}`);
	let listr = reverse(list)
	console.log(`The list in reverse order:, ${listr}`);
	document.getElementById("a1-bx").innerHTML = "Array was printed to console!";
}
function participants() {
	const list = [];
	const n_pp = prompt("How many people are coming? (eg. 67)")
	for (let step = 0; step < n_pp; step++)
		list.push(prompt("Give the name of a participant"));
	list.sort()
	const outputElement = document.getElementById("a2-tx");
		outputElement.innerHTML = ""
	let htmlContent = "";
	for (let i = 0; i < list.length; i++)
       htmlContent += `<h1>${list[i]}</h1>`; 
	outputElement.innerHTML = htmlContent;
}
function doGGo() {
	const list = [];
	for (let step = 0; step < 6; step++)
		list.push(prompt("Give the name of the dog"));
	list.sort()
	list.reverse()
	const outputElement = document.getElementById("a3-tx");
		outputElement.innerHTML = ""
	let htmlContent = "";
	for (let i = 0; i < list.length; i++)
       htmlContent += `<h1>${list[i]}</h1>`; 
	outputElement.innerHTML = htmlContent;
	
}
function nmbrQuery () {
	const list =  []
	while (true) {
    	const input = prompt("Enter a number (0 to stop):");
		if (input == 0) {break}
		else {list.push(input)}
		
		}
	list.sort(function(a, b){return b-a})
	console.log(list)
	document.getElementById("a4-bx").innerHTML = "Array was printed to console!";
}
function rollDice(min, max) {
    return Math.floor(Math.random() * (max - min + 1) + min);
}
function rollMain() {
    const listElement = document.getElementById('a4-tx');
	
    let result = 0;
    
    while (true) {
        result = rollDice(1, 6);
        
        if (result == 6) {
			const endItem = document.createElement('li');
            endItem.textContent = `--- Rolled 6; stopping ---`;
            listElement.appendChild(endItem);
            break; 
        } 
        
        const listItem = document.getElementById('li');
        const newListItem = document.createElement('li');
        newListItem.textContent = `You rolled a: ${result}`;
        listElement.appendChild(newListItem);
    }
}
</script>
